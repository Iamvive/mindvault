# Project-level OpenAI Codex Configuration File

[mcp_servers.penpot]
command = "npx"
args = ["-y", "@penpot/mcp@latest"]

[mcp_servers.penpot.env]
PENPOT_ACCESS_TOKEN = ""

[mcp_servers.github]
command = "npx"
args = ["-y", "@modelcontextprotocol/server-github"]

[mcp_servers.github.env]
GITHUB_PERSONAL_ACCESS_TOKEN = ""

[mcp_servers.headroom]
command = "npx"
args = ["-y", "headroom-mcp"]

[mcp_servers.mobile]
command = "npx"
args = ["-y", "mobile-mcp-server"]

[mcp_servers.mobile.env]
ANDROID_SDK_ROOT = ""
IOS_SIMULATOR_ID = ""

[mcp_servers.neosapien]
command = "npx"
args = ["-y", "mcp-remote", "https://api.neosapien.xyz/mcp"]

[mcp_servers.finance-bot]
command = "npx"
args = ["-y", "mcp-remote", "http://localhost:8000/mcp"]
